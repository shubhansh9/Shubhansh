<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budget Tracker — Shubhansh</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --bg2: #111;
      --bg3: #1a1a1a;
      --white: #f0eeea;
      --muted: #b0b0b0;
      --accent: #2dd4bf;
      --income: #4ade80;
      --expense: #f87171;
      --border: rgba(255,255,255,0.07);
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      padding: 2rem;
    }

    .app { max-width: 560px; margin: 0 auto; }

    .header { margin-bottom: 2rem; }
    .header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; }
    .header h1 span { color: var(--accent); }
    .header p { color: var(--muted); font-family: 'Space Mono', monospace; font-size: 0.75rem; margin-top: 0.4rem; }

    /* Summary Cards */
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }

    .summary-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem;
    }

    .summary-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .summary-val {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .summary-val.balance { color: var(--accent); }
    .summary-val.income  { color: var(--income); }
    .summary-val.expense { color: var(--expense); }

    /* Add Form */
    .form-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.4rem;
      margin-bottom: 1.5rem;
    }

    .form-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
    }

    .form-grid input, .form-grid select, .form-full input {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 0.9rem;
      color: var(--white);
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }

    .form-grid input:focus, .form-grid select:focus, .form-full input:focus {
      border-color: var(--accent);
    }

    .form-grid input::placeholder, .form-full input::placeholder { color: var(--muted); }
    .form-grid select option { background: var(--bg2); }

    .form-full { margin-bottom: 0.6rem; }

    .type-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .type-btn {
      flex: 1;
      padding: 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: none;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .type-btn.income.active  { background: rgba(74,222,128,0.12); border-color: var(--income); color: var(--income); }
    .type-btn.expense.active { background: rgba(248,113,113,0.12); border-color: var(--expense); color: var(--expense); }

    .add-btn {
      width: 100%;
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      border-radius: 8px;
      padding: 0.85rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 0.2rem;
    }

    .add-btn:hover { opacity: 0.85; }

    /* Transactions */
    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.8rem;
    }

    .tx-list { display: flex; flex-direction: column; gap: 0.5rem; }

    .tx-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tx-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .tx-dot.income  { background: var(--income); }
    .tx-dot.expense { background: var(--expense); }

    .tx-info { flex: 1; }
    .tx-name { font-size: 0.9rem; font-weight: 600; }
    .tx-cat  { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--muted); margin-top: 0.15rem; }

    .tx-amount { font-weight: 700; font-size: 0.95rem; }
    .tx-amount.income  { color: var(--income); }
    .tx-amount.expense { color: var(--expense); }

    .tx-delete {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      transition: all 0.2s;
      opacity: 0;
    }

    .tx-item:hover .tx-delete { opacity: 1; }
    .tx-delete:hover { color: var(--expense); }

    .empty {
      text-align: center;
      padding: 2.5rem 0;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Budget<span>.</span></h1>
      <p>Track your income and expenses</p>
    </div>

    <!-- Summary -->
    <div class="summary">
      <div class="summary-card">
        <div class="summary-label">Balance</div>
        <div class="summary-val balance" id="balance">₹0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Income</div>
        <div class="summary-val income" id="totalIncome">₹0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Expenses</div>
        <div class="summary-val expense" id="totalExpense">₹0</div>
      </div>
    </div>

    <!-- Add Transaction -->
    <div class="form-card">
      <div class="form-title">Add Transaction</div>
      <div class="type-row">
        <button class="type-btn income active" id="incomeBtn" onclick="setType('income')">+ Income</button>
        <button class="type-btn expense" id="expenseBtn" onclick="setType('expense')">− Expense</button>
      </div>
      <div class="form-full">
        <input type="text" id="txName" placeholder="Description (e.g. Freelance payment)" />
      </div>
      <div class="form-grid">
        <input type="number" id="txAmount" placeholder="Amount (₹)" min="0" />
        <select id="txCategory">
          <option value="General">General</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Freelance">Freelance</option>
          <option value="Education">Education</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <button class="add-btn" onclick="addTransaction()">Add Transaction</button>
    </div>

    <!-- Transaction List -->
    <div class="section-title">Transactions</div>
    <div class="tx-list" id="txList"></div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('budget_txs') || '[]');
    let currentType = 'income';

    function save() { localStorage.setItem('budget_txs', JSON.stringify(transactions)); }

    function setType(type) {
      currentType = type;
      document.getElementById('incomeBtn').classList.toggle('active', type === 'income');
      document.getElementById('expenseBtn').classList.toggle('active', type === 'expense');
    }

    function fmt(n) { return '₹' + Math.abs(n).toLocaleString('en-IN'); }

    function addTransaction() {
      const name   = document.getElementById('txName').value.trim();
      const amount = parseFloat(document.getElementById('txAmount').value);
      const cat    = document.getElementById('txCategory').value;

      if (!name || isNaN(amount) || amount <= 0) return;

      transactions.unshift({
        id: Date.now(),
        name, amount, cat,
        type: currentType
      });

      document.getElementById('txName').value = '';
      document.getElementById('txAmount').value = '';
      save(); render();
    }

    function deleteTx(id) {
      transactions = transactions.filter(t => t.id !== id);
      save(); render();
    }

    function render() {
      const income  = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
      const expense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
      const balance = income - expense;

      document.getElementById('balance').textContent      = fmt(balance);
      document.getElementById('totalIncome').textContent  = fmt(income);
      document.getElementById('totalExpense').textContent = fmt(expense);

      document.getElementById('balance').style.color =
        balance >= 0 ? 'var(--accent)' : 'var(--expense)';

      const list = document.getElementById('txList');
      if (transactions.length === 0) {
        list.innerHTML = `<div class="empty">No transactions yet ✦</div>`;
        return;
      }

      list.innerHTML = transactions.map(t => `
        <div class="tx-item">
          <div class="tx-dot ${t.type}"></div>
          <div class="tx-info">
            <div class="tx-name">${t.name}</div>
            <div class="tx-cat">${t.cat}</div>
          </div>
          <div class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '−'}${fmt(t.amount)}</div>
          <button class="tx-delete" onclick="deleteTx(${t.id})">✕</button>
        </div>
      `).join('');
    }

    render();
  </script>
</body>
</html>
