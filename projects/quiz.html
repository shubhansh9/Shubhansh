<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CS Quiz — Shubhansh</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --bg2: #111;
      --bg3: #1a1a1a;
      --white: #f0eeea;
      --muted: #b0b0b0;
      --accent: #2dd4bf;
      --correct: #4ade80;
      --wrong: #f87171;
      --border: rgba(255,255,255,0.07);
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .app { width: 100%; max-width: 560px; }

    /* SCREEN MANAGEMENT */
    .screen { display: none; animation: fadeUp 0.3s ease; }
    .screen.active { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* START SCREEN */
    .start-header h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 0.5rem; }
    .start-header h1 span { color: var(--accent); }
    .start-header p { color: var(--muted); font-family: 'Space Mono', monospace; font-size: 0.78rem; margin-bottom: 2rem; }

    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
      margin-bottom: 1.5rem;
    }

    .cat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    .cat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .cat-card.selected { border-color: var(--accent); background: rgba(45,212,191,0.08); }

    .cat-icon { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .cat-name { font-size: 0.95rem; font-weight: 700; }
    .cat-count { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--muted); margin-top: 0.2rem; }

    .start-btn {
      width: 100%;
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      border-radius: 12px;
      padding: 1rem;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.02em;
    }

    .start-btn:hover { opacity: 0.85; }
    .start-btn:active { transform: scale(0.98); }

    /* QUIZ SCREEN */
    .quiz-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .quiz-progress-text {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .quiz-score-badge {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 0.3rem 0.8rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent);
    }

    .progress-bar {
      height: 3px;
      background: var(--bg2);
      border-radius: 3px;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .question-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.8rem;
      margin-bottom: 1rem;
    }

    .question-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.8rem;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .option-btn {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1.1rem;
      color: var(--white);
      font-family: 'Syne', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .option-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(45,212,191,0.05); }

    .option-btn.correct { border-color: var(--correct); background: rgba(74,222,128,0.1); color: var(--correct); }
    .option-btn.wrong   { border-color: var(--wrong);   background: rgba(248,113,113,0.1); color: var(--wrong); }

    .option-letter {
      width: 26px; height: 26px;
      border-radius: 6px;
      background: var(--bg3);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.correct .option-letter { background: var(--correct); color: #0a0a0a; }
    .option-btn.wrong   .option-letter { background: var(--wrong);   color: #0a0a0a; }

    .next-btn {
      width: 100%;
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      border-radius: 10px;
      padding: 0.9rem;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 0.5rem;
      display: none;
    }

    .next-btn.show { display: block; }
    .next-btn:hover { opacity: 0.85; }

    /* RESULT SCREEN */
    .result-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .result-emoji { font-size: 3.5rem; margin-bottom: 1rem; }
    .result-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.4rem; }
    .result-sub { color: var(--muted); font-family: 'Space Mono', monospace; font-size: 0.78rem; margin-bottom: 2rem; }

    .score-big {
      font-size: 4rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 0.3rem;
    }

    .score-label { color: var(--muted); font-family: 'Space Mono', monospace; font-size: 0.75rem; }

    .result-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .res-stat-val { font-size: 1.3rem; font-weight: 800; }
    .res-stat-val.c { color: var(--correct); }
    .res-stat-val.w { color: var(--wrong); }
    .res-stat-label { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--muted); margin-top: 0.2rem; }

    .retry-btn {
      width: 100%;
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      border-radius: 12px;
      padding: 1rem;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .retry-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
<div class="app">

  <!-- START SCREEN -->
  <div class="screen active" id="startScreen">
    <div class="start-header">
      <h1>CS <span>Quiz</span></h1>
      <p>Test your knowledge — pick a category</p>
    </div>
    <div class="category-grid">
      <div class="cat-card selected" onclick="selectCat(this, 'dsa')">
        <div class="cat-icon">🧠</div>
        <div class="cat-name">DSA</div>
        <div class="cat-count">10 questions</div>
      </div>
      <div class="cat-card" onclick="selectCat(this, 'webdev')">
        <div class="cat-icon">🌐</div>
        <div class="cat-name">Web Dev</div>
        <div class="cat-count">10 questions</div>
      </div>
      <div class="cat-card" onclick="selectCat(this, 'cpp')">
        <div class="cat-icon">⚡</div>
        <div class="cat-name">C++</div>
        <div class="cat-count">10 questions</div>
      </div>
      <div class="cat-card" onclick="selectCat(this, 'cs')">
        <div class="cat-icon">💻</div>
        <div class="cat-name">CS Basics</div>
        <div class="cat-count">10 questions</div>
      </div>
    </div>
    <button class="start-btn" onclick="startQuiz()">Start Quiz →</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="screen" id="quizScreen">
    <div class="quiz-top">
      <span class="quiz-progress-text" id="progressText">Question 1 of 10</span>
      <span class="quiz-score-badge" id="scoreBadge">Score: 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="question-card">
      <div class="question-label" id="categoryLabel">DSA</div>
      <div class="question-text" id="questionText"></div>
    </div>
    <div class="options-grid" id="optionsGrid"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next →</button>
  </div>

  <!-- RESULT SCREEN -->
  <div class="screen" id="resultScreen">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="score-big" id="scoreBig"></div>
      <div class="score-label">Your Score</div>
      <div class="result-stats">
        <div>
          <div class="res-stat-val c" id="correctCount"></div>
          <div class="res-stat-label">Correct</div>
        </div>
        <div>
          <div class="res-stat-val w" id="wrongCount"></div>
          <div class="res-stat-label">Wrong</div>
        </div>
        <div>
          <div class="res-stat-val" id="accuracy"></div>
          <div class="res-stat-label">Accuracy</div>
        </div>
      </div>
    </div>
    <button class="retry-btn" onclick="goHome()">Try Again →</button>
  </div>

</div>

<script>
  const questions = {
    dsa: [
      { q: "What is the time complexity of Binary Search?", options: ["O(n)", "O(log n)", "O(n²)", "O(1)"], ans: 1 },
      { q: "Which data structure uses LIFO order?", options: ["Queue", "Stack", "Heap", "Tree"], ans: 1 },
      { q: "What is the worst case time complexity of QuickSort?", options: ["O(n log n)", "O(n)", "O(n²)", "O(log n)"], ans: 2 },
      { q: "Which traversal of a BST gives sorted output?", options: ["Preorder", "Postorder", "Inorder", "Level Order"], ans: 2 },
      { q: "What is the space complexity of Merge Sort?", options: ["O(1)", "O(log n)", "O(n)", "O(n²)"], ans: 2 },
      { q: "Which data structure is used in BFS?", options: ["Stack", "Queue", "Heap", "Graph"], ans: 1 },
      { q: "What is a complete binary tree?", options: ["All nodes have 2 children", "All levels filled except possibly last", "Height is log n", "Root has no parent"], ans: 1 },
      { q: "Time complexity of inserting into a Hash Table (average)?", options: ["O(n)", "O(log n)", "O(1)", "O(n²)"], ans: 2 },
      { q: "Which algorithm is used for finding shortest path in unweighted graph?", options: ["DFS", "BFS", "Dijkstra", "Bellman-Ford"], ans: 1 },
      { q: "What does DP stand for in algorithms?", options: ["Data Processing", "Dynamic Programming", "Direct Path", "Deep Parsing"], ans: 1 },
    ],
    webdev: [
      { q: "Which HTML tag is used to link CSS?", options: ["<style>", "<css>", "<link>", "<script>"], ans: 2 },
      { q: "What does CSS stand for?", options: ["Computer Style Sheets", "Cascading Style Sheets", "Creative Style System", "Coded Style Syntax"], ans: 1 },
      { q: "Which JS method removes the last element of an array?", options: [".shift()", ".pop()", ".splice()", ".slice()"], ans: 1 },
      { q: "What is the default value of position in CSS?", options: ["relative", "absolute", "fixed", "static"], ans: 3 },
      { q: "Which HTTP method is used to send data to a server?", options: ["GET", "PUT", "POST", "DELETE"], ans: 2 },
      { q: "What does DOM stand for?", options: ["Document Object Model", "Data Object Manager", "Dynamic Object Method", "Document Order Map"], ans: 0 },
      { q: "Which CSS property controls text size?", options: ["text-size", "font-size", "text-scale", "font-weight"], ans: 1 },
      { q: "What is the correct way to declare a JS variable (modern)?", options: ["var x = 5", "let x = 5", "int x = 5", "dim x = 5"], ans: 1 },
      { q: "Which tag creates a hyperlink in HTML?", options: ["<link>", "<href>", "<a>", "<url>"], ans: 2 },
      { q: "What does API stand for?", options: ["Application Programming Interface", "App Process Integration", "Automated Program Input", "Applied Protocol Index"], ans: 0 },
    ],
    cpp: [
      { q: "What is the correct syntax to output text in C++?", options: ["Console.WriteLine()", "print()", "cout <<", "printf only"], ans: 2 },
      { q: "Which header file is required for cout?", options: ["<stdio.h>", "<iostream>", "<conio.h>", "<stdlib.h>"], ans: 1 },
      { q: "What is the size of int in C++ (typically)?", options: ["2 bytes", "4 bytes", "8 bytes", "1 byte"], ans: 1 },
      { q: "What does '&' mean in a function parameter in C++?", options: ["Pointer", "Reference", "Address", "Bitwise AND"], ans: 1 },
      { q: "Which keyword is used to define a class in C++?", options: ["struct", "object", "class", "type"], ans: 2 },
      { q: "What is a vector in C++?", options: ["A math concept", "A dynamic array", "A pointer type", "A sorting algorithm"], ans: 1 },
      { q: "What does 'auto' keyword do in C++?", options: ["Automatic memory allocation", "Type inference", "Auto increment", "None of these"], ans: 1 },
      { q: "Which loop is guaranteed to execute at least once?", options: ["for", "while", "do-while", "foreach"], ans: 2 },
      { q: "What is the time complexity of std::sort in C++?", options: ["O(n)", "O(n²)", "O(n log n)", "O(log n)"], ans: 2 },
      { q: "What does 'endl' do in C++?", options: ["Ends the program", "Inserts newline and flushes", "Ends a loop", "Declares end variable"], ans: 1 },
    ],
    cs: [
      { q: "What does CPU stand for?", options: ["Central Process Unit", "Central Processing Unit", "Core Processing Utility", "Computer Processing Unit"], ans: 1 },
      { q: "What is the binary representation of decimal 10?", options: ["1010", "1100", "1001", "1110"], ans: 0 },
      { q: "Which layer of OSI model handles routing?", options: ["Data Link", "Transport", "Network", "Session"], ans: 2 },
      { q: "What is a deadlock in OS?", options: ["System crash", "Two processes waiting for each other forever", "Memory overflow", "CPU overload"], ans: 1 },
      { q: "What does RAM stand for?", options: ["Read Access Memory", "Random Access Memory", "Rapid Application Memory", "Read And Modify"], ans: 1 },
      { q: "Which sorting algorithm has best average case O(n log n)?", options: ["Bubble Sort", "Insertion Sort", "Merge Sort", "Selection Sort"], ans: 2 },
      { q: "What is a primary key in a database?", options: ["First column", "Unique identifier for each row", "Auto-increment field", "Foreign key reference"], ans: 1 },
      { q: "What does HTTP stand for?", options: ["HyperText Transfer Protocol", "High Text Transport Protocol", "HyperText Transmission Process", "Host Transfer Text Protocol"], ans: 0 },
      { q: "Which gate outputs 1 only when both inputs are 1?", options: ["OR", "NOT", "AND", "XOR"], ans: 2 },
      { q: "What is a compiler?", options: ["Runs code line by line", "Translates entire source code to machine code", "Only checks syntax", "Manages memory"], ans: 1 },
    ]
  };

  let selectedCat = 'dsa';
  let currentQ = 0;
  let score = 0;
  let correct = 0;
  let wrong = 0;
  let quizQuestions = [];
  let answered = false;

  const letters = ['A', 'B', 'C', 'D'];

  function selectCat(el, cat) {
    document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedCat = cat;
  }

  function startQuiz() {
    quizQuestions = [...questions[selectedCat]].sort(() => Math.random() - 0.5);
    currentQ = 0; score = 0; correct = 0; wrong = 0;
    showScreen('quizScreen');
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    const q = quizQuestions[currentQ];
    const total = quizQuestions.length;

    document.getElementById('progressText').textContent = `Question ${currentQ + 1} of ${total}`;
    document.getElementById('scoreBadge').textContent = `Score: ${score}`;
    document.getElementById('progressFill').style.width = `${(currentQ / total) * 100}%`;
    document.getElementById('categoryLabel').textContent = selectedCat.toUpperCase();
    document.getElementById('questionText').textContent = q.q;
    document.getElementById('nextBtn').classList.remove('show');

    const grid = document.getElementById('optionsGrid');
    grid.innerHTML = q.options.map((opt, i) => `
      <button class="option-btn" onclick="selectAnswer(this, ${i})">
        <span class="option-letter">${letters[i]}</span>
        ${opt}
      </button>
    `).join('');
  }

  function selectAnswer(btn, idx) {
    if (answered) return;
    answered = true;

    const q = quizQuestions[currentQ];
    const btns = document.querySelectorAll('.option-btn');

    btns.forEach((b, i) => {
      b.disabled = true;
      if (i === q.ans) b.classList.add('correct');
    });

    if (idx === q.ans) {
      score += 10; correct++;
    } else {
      btn.classList.add('wrong');
      wrong++;
    }

    document.getElementById('scoreBadge').textContent = `Score: ${score}`;
    document.getElementById('nextBtn').classList.add('show');
    document.getElementById('nextBtn').textContent =
      currentQ < quizQuestions.length - 1 ? 'Next →' : 'See Results →';
  }

  function nextQuestion() {
    currentQ++;
    if (currentQ < quizQuestions.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    const total = quizQuestions.length;
    const pct = Math.round((correct / total) * 100);

    const ratings = [
      { min: 90, emoji: '🏆', title: 'Outstanding!',  sub: 'You really know your stuff.' },
      { min: 70, emoji: '🎯', title: 'Great Job!',     sub: 'Strong performance overall.' },
      { min: 50, emoji: '👍', title: 'Not Bad!',       sub: 'Keep practicing to improve.' },
      { min: 0,  emoji: '📚', title: 'Keep Grinding!', sub: 'More practice = more progress.' },
    ];

    const r = ratings.find(x => pct >= x.min);
    document.getElementById('resultEmoji').textContent = r.emoji;
    document.getElementById('resultTitle').textContent = r.title;
    document.getElementById('resultSub').textContent   = r.sub;
    document.getElementById('scoreBig').textContent    = `${score}/${total * 10}`;
    document.getElementById('correctCount').textContent = correct;
    document.getElementById('wrongCount').textContent   = wrong;
    document.getElementById('accuracy').textContent     = pct + '%';

    showScreen('resultScreen');
  }

  function goHome() { showScreen('startScreen'); }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
</script>
</body>
</html>
