<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App — Shubhansh</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --bg2: #111;
      --bg3: #1a1a1a;
      --white: #f0eeea;
      --muted: #b0b0b0;
      --accent: #2dd4bf;
      --danger: #f87171;
      --border: rgba(255,255,255,0.07);
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    .header {
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header h1 span { color: var(--accent); }

    .header p {
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      margin-top: 0.4rem;
    }

    .input-row {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .input-row input {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      color: var(--white);
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus { border-color: var(--accent); }
    .input-row input::placeholder { color: var(--muted); }

    .input-row button {
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      border-radius: 10px;
      padding: 0.85rem 1.4rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .input-row button:hover { opacity: 0.85; }
    .input-row button:active { transform: scale(0.96); }

    .filters {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1.2rem;
    }

    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 0.35rem 0.9rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0a0a0a;
      font-weight: 700;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      animation: slideIn 0.25s ease;
      transition: border-color 0.2s;
    }

    .todo-item:hover { border-color: rgba(255,255,255,0.12); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-check {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }

    .todo-check.done {
      background: var(--accent);
      border-color: var(--accent);
    }

    .todo-check.done::after {
      content: '✓';
      font-size: 0.7rem;
      color: #0a0a0a;
      font-weight: 700;
    }

    .todo-text {
      flex: 1;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .todo-text.done {
      text-decoration: line-through;
      color: var(--muted);
    }

    .todo-delete {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      transition: all 0.2s;
      opacity: 0;
    }

    .todo-item:hover .todo-delete { opacity: 1; }
    .todo-delete:hover { color: var(--danger); background: rgba(248,113,113,0.1); }

    .empty {
      text-align: center;
      padding: 3rem 0;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .stats span {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .clear-btn:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>My <span>Tasks</span></h1>
      <p id="dateDisplay"></p>
    </div>

    <div class="input-row">
      <input type="text" id="todoInput" placeholder="Add a new task..." />
      <button onclick="addTodo()">+</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
      <button class="filter-btn" onclick="setFilter('done', this)">Done</button>
    </div>

    <div class="todo-list" id="todoList"></div>

    <div class="stats">
      <span id="statsText">0 tasks remaining</span>
      <button class="clear-btn" onclick="clearDone()">Clear completed</button>
    </div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    let filter = 'all';

    // Date display
    document.getElementById('dateDisplay').textContent =
      new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

    function save() { localStorage.setItem('todos', JSON.stringify(todos)); }

    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;
      todos.unshift({ id: Date.now(), text, done: false });
      input.value = '';
      save();
      render();
    }

    function toggle(id) {
      todos = todos.map(t => t.id === id ? { ...t, done: !t.done } : t);
      save(); render();
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      save(); render();
    }

    function clearDone() {
      todos = todos.filter(t => !t.done);
      save(); render();
    }

    function setFilter(f, btn) {
      filter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function render() {
      const list = document.getElementById('todoList');
      const filtered = todos.filter(t =>
        filter === 'all' ? true : filter === 'done' ? t.done : !t.done
      );

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty">No tasks here ✦</div>`;
      } else {
        list.innerHTML = filtered.map(t => `
          <div class="todo-item">
            <div class="todo-check ${t.done ? 'done' : ''}" onclick="toggle(${t.id})"></div>
            <span class="todo-text ${t.done ? 'done' : ''}">${t.text}</span>
            <button class="todo-delete" onclick="deleteTodo(${t.id})">✕</button>
          </div>
        `).join('');
      }

      const remaining = todos.filter(t => !t.done).length;
      document.getElementById('statsText').textContent =
        `${remaining} task${remaining !== 1 ? 's' : ''} remaining`;
    }

    document.getElementById('todoInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTodo();
    });

    render();
  </script>
</body>
</html>
